name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bottle_mode: test_bot
          - os: macos-15-intel
            bottle_mode: source_dependencies
          - os: macos-26
            bottle_mode: test_bot
          - os: macos-26-intel
            bottle_mode: source_dependencies
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # Without an explicit root_url, Homebrew derives the public GitHub
      # Releases URL from this tap. That is the customer download path.
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request' && matrix.bottle_mode == 'test_bot'

      # The test-bot currently rejects older compatible Go bottles for Intel
      # macOS targets. Install the build-only dependency on the CI runner,
      # then bottle and pour-test Normatik itself. End users still receive a
      # prebuilt Normatik bottle and never compile Go locally.
      - name: Build and pour-test Intel bottle
        if: github.event_name == 'pull_request' && matrix.bottle_mode == 'source_dependencies'
        run: |
          formula_info="$(brew info --json=v2 --formula 42bv/tap/normatik)"
          version="$(jq -r '.formulae[0].versions.stable' <<< "$formula_info")"
          revision="$(jq -r '.formulae[0].revision // 0' <<< "$formula_info")"
          if [[ "$revision" -gt 0 ]]; then
            version="${version}_${revision}"
          fi
          bottle_root_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/normatik-${version}"
          brew install --build-bottle --formula 42bv/tap/normatik
          brew test 42bv/tap/normatik
          brew bottle --json --root-url="$bottle_root_url" 42bv/tap/normatik
          brew bottle --merge --write --no-commit --no-all-checks ./normatik--*.bottle.json
          brew uninstall --formula --force --ignore-dependencies 42bv/tap/normatik
          HOMEBREW_DEVELOPER=1 brew install --only-dependencies ./normatik--*.bottle*.tar.gz
          HOMEBREW_DEVELOPER=1 brew install ./normatik--*.bottle*.tar.gz
          HOMEBREW_DEVELOPER=1 brew test 42bv/tap/normatik

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
